<title>Gloomjaw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-bleed void-jungle stage, button tray below (sidebar on wide screens). Single dark look. */
:root{
  --bg:#0f0a18; --tray:#171026; --raised:#251a3a; --line:#352850;
  --fg:#f5ecff; --muted:#a898c8; --violet:#b56bff; --violet-ink:#1c0833; --gold:#ffd34d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1;color:var(--fg);text-shadow:0 0 18px rgba(181,107,255,.55),0 2px 0 rgba(0,0,0,.5)}
.brand p{margin:4px 0 0;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.hud-r{display:flex;gap:8px;pointer-events:auto}
.icon-btn{font:800 12px var(--body);color:var(--fg);background:rgba(15,10,24,.7);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.icon-btn[aria-pressed="true"]{border-color:var(--violet);color:var(--violet)}
.status{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--muted);background:rgba(15,10,24,.6);padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);font-family:var(--display);font-size:24px;color:var(--fg);transition:opacity .5s}
.loading small{font-family:var(--body);font-weight:700;font-size:14px;color:var(--muted)}
.loading.done{opacity:0;pointer-events:none}
.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--violet) 40%,transparent 70%);box-shadow:0 0 30px var(--violet);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.8);opacity:.6}}
.tray{background:var(--tray);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{font-family:var(--display);font-size:18px;color:var(--fg);background:var(--raised);border:2px solid transparent;border-radius:14px;padding:14px 6px 12px;cursor:pointer;box-shadow:0 4px 0 #08050e;transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #08050e}
.act[aria-pressed="true"]{background:var(--violet);color:var(--violet-ink);border-color:var(--gold)}
.act.hot{background:#3a1d5c}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:380px){.act{font-size:16px;padding:12px 4px 10px}}
@media (min-width:880px){.app{flex-direction:row}.tray{width:360px;flex:none;border-top:0;border-left:1px solid var(--line);justify-content:center;gap:14px}.grid{grid-template-columns:repeat(2,1fr)}.act{padding:20px 8px 18px;font-size:20px}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}.act{transition:none}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Gloomjaw the dragon in 3D. Drag to look around, pinch or scroll to zoom."></canvas>
    <div class="hud">
      <div class="brand"><h1>Gloomjaw</h1><p>Asher's dragon · Void Jungle</p></div>
      <div class="hud-r">
        <button class="icon-btn" id="bSpin" aria-pressed="false">Spin</button>
        <button class="icon-btn" id="bMute" aria-pressed="false">Sound on</button>
      </div>
    </div>
    <div class="status" id="status">Drag to look around · Pinch to zoom</div>
    <div class="loading" id="loading"><div class="orb"></div><span id="loadText">Summoning Gloomjaw…</span><small id="loadSub">Loading the 3D model</small></div>
  </div>

  <div class="tray">
    <div class="eyebrow">Move</div>
    <div class="grid">
      <button class="act" id="mWalk" aria-pressed="false">Walk</button>
      <button class="act" id="mRun" aria-pressed="false">Run</button>
      <button class="act" id="mFly" aria-pressed="false">Fly</button>
    </div>
    <div class="eyebrow">Action</div>
    <div class="grid">
      <button class="act hot" id="aFlap">Flap Wings</button>
      <button class="act hot" id="aFire">Breathe Fire</button>
      <button class="act hot" id="aRoar">Roar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const V=THREE.Vector3;
const FIRE=[0xeccbff,0xb14dff,0x5e18c8];
const FIRE_DUR=5.2,ROAR_DUR=2.8,FLAP_DUR=3.6;

/* ---------- scene ---------- */
const stage=$("#stage"),canvas=$("#c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f0a18);scene.fog=new THREE.Fog(0x0f0a18,28,70);
const camera=new THREE.PerspectiveCamera(40,1,.1,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,1.8,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=6;controls.maxDistance=34;controls.maxPolarAngle=Math.PI*.49;controls.autoRotateSpeed=2;

scene.add(new THREE.HemisphereLight(0xe8dcff,0x2a1840,.85));
const sun=new THREE.DirectionalLight(0xfff0f8,1.7);sun.position.set(6,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:50});sun.shadow.bias=-.0006;
scene.add(sun);scene.add(sun.target);
const rim=new THREE.DirectionalLight(0xb36bff,1.6);rim.position.set(-8,5,-7);scene.add(rim);
const fireLight=new THREE.PointLight(0xa040ff,0,12,2);scene.add(fireLight);

const ground=new THREE.Mesh(new THREE.CircleGeometry(70,96),new THREE.MeshStandardMaterial({color:0x150e22,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// glowing void-jungle mushrooms around the clearing
(function(){const stemM=new THREE.MeshStandardMaterial({color:0x2c2140,roughness:.9});
  const capM=new THREE.MeshStandardMaterial({color:0x9b4dff,emissive:0xa855ff,emissiveIntensity:1.1,roughness:.5});
  const capM2=new THREE.MeshStandardMaterial({color:0xd38bff,emissive:0xc77dff,emissiveIntensity:.9,roughness:.5});
  const stemG=new THREE.CylinderGeometry(.08,.13,1,8),capG=new THREE.SphereGeometry(.5,18,10,0,Math.PI*2,0,Math.PI/2);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++){const a=rnd()*Math.PI*2,r=17+rnd()*30,s=.5+rnd()*1.8;const g=new THREE.Group();
    const h=.5+rnd()*1.2;const st=new THREE.Mesh(stemG,stemM);st.scale.set(s,h*s,s);st.position.y=h*s/2;g.add(st);
    const cp=new THREE.Mesh(capG,rnd()>.5?capM:capM2);cp.scale.set(s*(.8+rnd()*.6),s*(.5+rnd()*.4),s*(.8+rnd()*.6));cp.position.y=h*s;g.add(cp);
    g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(g);}
  const rockM=new THREE.MeshStandardMaterial({color:0x221a30,roughness:1,flatShading:true});
  for(let i=0;i<26;i++){const a=rnd()*Math.PI*2,r=16+rnd()*28,s=.4+rnd()*1.4;const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockM);m.scale.y=.6;m.position.set(Math.cos(a)*r,s*.25,Math.sin(a)*r);m.rotation.y=rnd()*6;m.castShadow=true;scene.add(m);}
})();

// floating void motes
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"));return new THREE.CanvasTexture(c);}
const glowTex=canvasTex(64,64,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.35,"rgba(255,255,255,.7)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(0,0,64,64);});
const motes=[];for(let i=0;i<80;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xb36bff,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false}));
  sp.userData={a:Math.random()*6.28,r:4+Math.random()*24,y:Math.random()*8,sp:.2+Math.random()*.5};sp.scale.setScalar(.08+Math.random()*.14);scene.add(sp);motes.push(sp);}

/* ---------- breath particles ---------- */
const FC=FIRE.map(c=>new THREE.Color(c));
const starTex=canvasTex(64,64,g=>{g.translate(32,32);const gr=g.createRadialGradient(0,0,0,0,0,10);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.beginPath();g.arc(0,0,10,0,Math.PI*2);g.fill();
  g.fillStyle="#fff";for(let r=0;r<4;r++){g.rotate(Math.PI/2);g.beginPath();g.moveTo(0,-30);g.lineTo(3.2,-3.2);g.lineTo(-3.2,-3.2);g.closePath();g.fill();}
  g.rotate(Math.PI/4);g.globalAlpha=.6;for(let r=0;r<4;r++){g.rotate(Math.PI/2);g.beginPath();g.moveTo(0,-16);g.lineTo(2,-2);g.lineTo(-2,-2);g.closePath();g.fill();}});
const STAR=[new THREE.Color(0xffffff),new THREE.Color(0xd9b3ff)];
const fire={pool:[],next:0,acc:0};
for(let i=0;i<440;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,toneMapped:false}));sp.visible=false;scene.add(sp);fire.pool.push({sp,v:new V(),age:0,life:1,alive:false});}
const _p=new V(),_d=new V();
function getMouth(p,d){rig.mouth.getWorldPosition(p);d.set(0,-.12,1).applyQuaternion(model.quaternion).normalize();p.addScaledVector(d,.45);}
function emit(n){getMouth(_p,_d);for(let k=0;k<n;k++){const p=fire.pool[fire.next];fire.next=(fire.next+1)%fire.pool.length;
  p.star=Math.random()<.28;p.sp.material.map=p.star?starTex:glowTex;
  p.alive=true;p.age=0;p.life=p.star?.9+Math.random()*.7:.7+Math.random()*.45;p.sp.position.copy(_p);
  const sp=p.star?2.4:1.5;p.v.copy(_d).multiplyScalar(8+Math.random()*3.5);p.v.x+=(Math.random()-.5)*sp;p.v.y+=(Math.random()-.5)*sp*.7+.2;p.v.z+=(Math.random()-.5)*sp;
  p.spin=(Math.random()-.5)*8;p.tw=Math.random()*6;p.sz=p.star?.18+Math.random()*.22:1;
  p.sp.material.rotation=Math.random()*6.28;p.sp.visible=true;}}
function updateFire(dt){for(const p of fire.pool){if(!p.alive)continue;p.age+=dt;const u=p.age/p.life;if(u>=1){p.alive=false;p.sp.visible=false;continue;}
  p.sp.position.addScaledVector(p.v,dt);p.v.multiplyScalar(p.star?.975:.968);p.v.y+=(p.star?.3:.8)*dt;if(p.sp.position.y<.15){p.sp.position.y=.15;p.v.y=Math.abs(p.v.y)*.2;}
  const c=p.sp.material.color,m=p.sp.material;
  if(p.star){c.copy(STAR[0]).lerp(STAR[1],u);m.rotation+=p.spin*dt;m.opacity=(1-u);p.sp.scale.setScalar(p.sz*(.55+.45*Math.sin(p.age*28+p.tw)));continue;}
  if(u<.3)c.copy(FC[0]).lerp(FC[1],u/.3);else c.copy(FC[1]).lerp(FC[2],(u-.3)/.7);
  m.opacity=Math.pow(1-u,1.2)*.85;p.sp.scale.setScalar(.3+2.2*u);}}

/* ---------- sound ---------- */
let ac=null,muted=false,noiseBuf=null;
function audio(){if(muted)return null;if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;}catch(e){return null;}}
  if(ac.state==="suspended")ac.resume();return ac;}
function noise(a,dur){const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start();s.stop(a.currentTime+dur);return s;}
function burst(freq,peak,dur){const a=audio();if(!a)return;const t0=a.currentTime,n=noise(a,dur+.05),lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=freq;
  const g=a.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+.03);g.gain.exponentialRampToValueAtTime(.001,t0+dur);n.connect(lp).connect(g).connect(a.destination);}
function sfxFire(){const a=audio();if(!a)return;const t0=a.currentTime,n=noise(a,FIRE_DUR),f=a.createBiquadFilter();f.type="lowpass";
  f.frequency.setValueAtTime(400,t0);f.frequency.linearRampToValueAtTime(2200,t0+.5);f.frequency.linearRampToValueAtTime(600,t0+FIRE_DUR);
  const g=a.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.5,t0+.35);g.gain.setValueAtTime(.5,t0+FIRE_DUR-.5);g.gain.linearRampToValueAtTime(0,t0+FIRE_DUR);n.connect(f).connect(g).connect(a.destination);}
/* lion-style roar: deep rising "aaOOUGH" with rough vocal growl, then a few chesty grunts */
function roarVoice(a,t0,d,f0,fPeak,fEnd,vol,peakAt){
  const out=a.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(vol,t0+d*peakAt);out.gain.setValueAtTime(vol,t0+d*(peakAt+.15));out.gain.exponentialRampToValueAtTime(.001,t0+d);
  // growl roughness: fast amplitude flutter
  const rough=a.createGain();rough.gain.value=.65;const lfo=a.createOscillator();lfo.frequency.setValueAtTime(34,t0);lfo.frequency.linearRampToValueAtTime(22,t0+d);const lg=a.createGain();lg.gain.value=.35;lfo.connect(lg).connect(rough.gain);
  const src=a.createGain();
  [[1,"sawtooth",.6],[.5,"square",.35],[1.007,"sawtooth",.4]].forEach(([m,type,g])=>{const o=a.createOscillator();o.type=type;
    o.frequency.setValueAtTime(f0*m,t0);o.frequency.linearRampToValueAtTime(fPeak*m,t0+d*peakAt);o.frequency.exponentialRampToValueAtTime(fEnd*m,t0+d);
    const og=a.createGain();og.gain.value=g;o.connect(og).connect(src);o.start(t0);o.stop(t0+d);});
  const n=noise(a,d),nb=a.createBiquadFilter();nb.type="bandpass";nb.frequency.value=700;nb.Q.value=.7;const ng=a.createGain();ng.gain.value=.5;n.connect(nb).connect(ng).connect(src);
  const ws=a.createWaveShaper(),cur=new Float32Array(512);for(let i=0;i<512;i++)cur[i]=Math.tanh((i/256-1)*6);ws.curve=cur;
  src.connect(ws).connect(rough);
  // throat formants: wide-open "aah" turning into "ooh"
  [[320,180,1.4,.9],[750,420,1.6,.7],[2300,1400,3,.25]].forEach(([fa,fb,q,g])=>{const bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=q;
    bp.frequency.setValueAtTime(fa,t0);bp.frequency.linearRampToValueAtTime(fa*1.1,t0+d*peakAt);bp.frequency.exponentialRampToValueAtTime(fb,t0+d);
    const bg=a.createGain();bg.gain.value=g;rough.connect(bp).connect(bg).connect(out);});
  const sub=a.createOscillator();sub.type="sine";sub.frequency.setValueAtTime(f0*.5,t0);sub.frequency.exponentialRampToValueAtTime(fEnd*.5,t0+d);const sg=a.createGain();sg.gain.value=.5;sub.connect(sg).connect(out);sub.start(t0);sub.stop(t0+d);
  lfo.start(t0);lfo.stop(t0+d);out.connect(a.destination);}
function sfxRoar(){const a=audio();if(!a)return;const t0=a.currentTime;
  roarVoice(a,t0,1.9,95,175,62,.42,.3);
  [2.0,2.38,2.72].forEach((s,i)=>roarVoice(a,t0+s,.32,85-i*6,105-i*8,60,.28-i*.06,.25));}

/* ---------- Gloomjaw rig (Meshy Smart Rig bones, posed by code) ---------- */
let model=null,inner=null,rig=null,glowMat=null;
const _q=new THREE.Quaternion(),_v=new V();
function mk(by,n){const b=by[n];if(!b)return null;const inv=b.getWorldQuaternion(new THREE.Quaternion()).invert();
  return{b,rest:b.quaternion.clone(),x:new V(1,0,0).applyQuaternion(inv).normalize(),y:new V(0,1,0).applyQuaternion(inv).normalize(),z:new V(0,0,1).applyQuaternion(inv).normalize()};}
function pose(e,ax,ay,az){if(!e)return;const q=e.b.quaternion.copy(e.rest);
  if(ax)q.multiply(_q.setFromAxisAngle(e.x,ax));if(ay)q.multiply(_q.setFromAxisAngle(e.y,ay));if(az)q.multiply(_q.setFromAxisAngle(e.z,az));}
function setupRig(){
  const by={};inner.traverse(o=>{if(o.isBone)by[o.name]=o;});inner.updateMatrixWorld(true);
  const r={spine:mk(by,"Bone_003"),chest:mk(by,"Bone_002"),neck:mk(by,"Bone_021"),head:mk(by,"Bone_020"),jaw:mk(by,"Bone_033"),skull:mk(by,"Bone_035"),
    shoulders:[mk(by,"Bone_041"),mk(by,"Bone_047")],
    wr:["Bone_025","Bone_024","Bone_023"].map(n=>mk(by,n)),wl:["Bone_028","Bone_027","Bone_026"].map(n=>mk(by,n)),
    tail:["Bone_019","Bone_018","Bone_017","Bone_016","Bone_015","Bone_014"].map(n=>mk(by,n)),mouth:by.Bone_032};
  // legs: hip, knee, ankle, toe. walk = lateral sequence, run = rotary gallop (phase offsets)
  r.legs=[
    {hip:"Bone_039",knee:"Bone_038",ankle:"Bone_037",toe:"Bone_036",front:1,side:1,walk:.75,run:.5},
    {hip:"Bone_045",knee:"Bone_044",ankle:"Bone_043",toe:"Bone_042",front:1,side:-1,walk:.25,run:.6},
    {hip:"Bone_013",knee:"Bone_012",ankle:"Bone_010",toe:"Bone_009",front:0,side:1,walk:.5,run:.1},
    {hip:"Bone_008",knee:"Bone_007",ankle:"Bone_005",toe:"Bone_004",front:0,side:-1,walk:0,run:0}
  ].map(L=>({...L,hip:mk(by,L.hip),knee:mk(by,L.knee),ankle:mk(by,L.ankle),toe:by[L.toe]}));
  r.legs.forEach(L=>{const fy=()=>{inner.updateMatrixWorld(true);return L.toe.getWorldPosition(_v).y;};
    pose(L.knee,.5);const up=fy();pose(L.knee,-.5);const dn=fy();pose(L.knee,0);L.ks=up>=dn?1:-1;});
  inner.updateMatrixWorld(true);
  // rest leg geometry in model space, used by the foot IK
  const loc=b=>inner.worldToLocal(b.getWorldPosition(new V()));
  r.legs.forEach(L=>{const H=loc(L.hip.b),K=loc(L.knee.b),A=loc(L.ankle.b);
    L.restA=A;L.L1=Math.hypot(K.y-H.y,K.z-H.z);L.L2=Math.hypot(A.y-K.y,A.z-K.z);
    L.a2rest=Math.atan2(A.z-K.z,A.y-K.y);
    L.cross=Math.sign((K.y-H.y)*(A.z-K.z)-(K.z-H.z)*(A.y-K.y))||1;
    L.plant=inner.localToWorld(A.clone());L.lift=L.plant.clone();L.land=L.plant.clone();L.swing=false;L.curl=0;});
  return r;}

/* ---------- movement ---------- */
// TUNE: change these numbers to adjust how Gloomjaw moves
const TUNE={
  walkSpeed:1.4, walkHz:.8,  walkDuty:.66, walkLift:.32,   // speed (units/s), steps per second, share of time a foot is down, foot lift height
  runSpeed:5.2,  runHz:1.9,  runDuty:.4,   runLift:.55,
  climbHz:1.7,   cruiseHz:1.15, flapsBeforeGlide:3, glideTime:1.8, cruiseAlt:3.8,  // flaps per second, glide length (s), flying height
  walkR:5, runR:7, flyR:10                                  // circle size for each move
};
const S={mode:"idle",fs:"ground",ft:0,heading:-.5,pos:new V(),speed:0,turn:0,alt:0,vy:0,
  step:0,runW:0,gp:0,hz:.8,roll:0,pitch:0,pedal:0,bob:0,crouch:0,support:4,
  wp:0,wRate:.25,amp:.05,base:.08,sweep:0,glide:0,flaps:0};
const act={fire:-1,roar:-1,flap:0};
const env=(tt,dur,a,b)=>tt<0||tt>dur?0:Math.max(0,Math.min(1,tt/a,(dur-tt)/b));
const k=(dt,r)=>Math.min(1,dt*r);
const ease=x=>x*x*(3-2*x);
const frac=x=>x-Math.floor(x);
const lerp=(a,b,u)=>a+(b-a)*u;
const wrapA=x=>Math.atan2(Math.sin(x),Math.cos(x));
let t=0;
// wing beat: fast power downstroke (40%), slower recovery upstroke (60%). +1 = up, -1 = down
const wingCurve=p=>p<.4?1-2*ease(p/.4):-1+2*ease((p-.4)/.6);

/* dust puffs on hard footfalls and landing */
const dust=[];let dustI=0;
for(let i=0;i<70;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x8a78a8,transparent:true,depthWrite:false,opacity:0}));sp.visible=false;scene.add(sp);dust.push({sp,age:0,life:1,alive:false,v:new V()});}
function spawnDust(p,n){for(let j=0;j<n;j++){const d=dust[dustI];dustI=(dustI+1)%dust.length;d.alive=true;d.age=0;d.life=.6+Math.random()*.5;
  d.sp.position.set(p.x+(Math.random()-.5)*.5,.15,p.z+(Math.random()-.5)*.5);d.v.set((Math.random()-.5)*1.4,.4+Math.random()*.6,(Math.random()-.5)*1.4);d.sp.visible=true;}}
function dustAtFeet(n){rig.legs.forEach(L=>spawnDust(L.plant,n));}
function updateDust(dt){dust.forEach(d=>{if(!d.alive)return;d.age+=dt;const u=d.age/d.life;if(u>=1){d.alive=false;d.sp.visible=false;return;}
  d.sp.position.addScaledVector(d.v,dt);d.v.multiplyScalar(.95);d.sp.material.opacity=.45*(1-u);d.sp.scale.setScalar(.4+1.5*u);});}

function move(dt){
  const m=S.mode,fly=m==="fly";
  // flight states: ground > crouch > climb > cruise > land > touch > ground
  switch(S.fs){
    case "ground":if(fly){S.fs="crouch";S.ft=0;}break;
    case "crouch":S.ft+=dt;if(!fly)S.fs="ground";else if(S.ft>.45){S.fs="climb";S.vy=5.5;burst(200,.8,.3);dustAtFeet(3);}break;
    case "climb":S.vy+=(1.6-S.vy)*k(dt,1.4);S.alt+=S.vy*dt;if(S.alt>=TUNE.cruiseAlt-.2)S.fs="cruise";if(!fly)S.fs="land";break;
    case "cruise":{const tgt=TUNE.cruiseAlt+.35*Math.sin(t*.45)-(S.glide>0?.3:0),na=S.alt+(tgt-S.alt)*k(dt,.7);S.vy=(na-S.alt)/Math.max(dt,1e-4);S.alt=na;if(!fly)S.fs="land";break;}
    case "land":S.vy+=((S.alt<1.4?-.7:-1.6)-S.vy)*k(dt,2.2);S.alt+=S.vy*dt;
      if(fly){S.fs="climb";S.vy=Math.max(S.vy,1.5);}
      else if(S.alt<=0){S.alt=0;S.vy=0;S.fs="touch";S.ft=0;burst(110,.9,.35);dustAtFeet(3);}break;
    case "touch":S.ft+=dt;if(S.ft>.6)S.fs="ground";break;
  }
  const air=S.fs==="climb"||S.fs==="cruise"||S.fs==="land";
  const hov=S.fs==="ground"&&act.flap>0;
  if(S.fs==="ground")S.alt+=((hov?1.4:0)-S.alt)*k(dt,hov?1.6:1.2);
  S.pedal+=((hov&&S.alt>.4?1:0)-S.pedal)*k(dt,3);
  // speed + circling path
  let spT=0;
  if(S.fs==="ground")spT=m==="walk"?TUNE.walkSpeed:m==="run"?TUNE.runSpeed:0;
  else if(S.fs==="climb")spT=4;else if(S.fs==="cruise")spT=6.5;else if(S.fs==="land")spT=S.alt<1.4?1.2:4;
  S.speed+=(spT-S.speed)*k(dt,S.fs==="touch"?4:1.3);
  const R=air?TUNE.flyR:m==="run"?TUNE.runR:TUNE.walkR;
  S.turn=S.speed/R;S.heading+=S.turn*dt;
  S.pos.x+=Math.sin(S.heading)*S.speed*dt;S.pos.z+=Math.cos(S.heading)*S.speed*dt;
  // gait
  const stepping=S.fs==="ground"&&S.alt<.2&&(m==="walk"||m==="run"||S.speed>.2);
  S.step+=((stepping?1:0)-S.step)*k(dt,4);
  S.runW+=((m==="run"?1:0)-S.runW)*k(dt,2.5);
  S.hz=lerp(TUNE.walkHz,TUNE.runHz,S.runW)*(.45+.55*Math.min(1,S.speed/lerp(TUNE.walkSpeed,TUNE.runSpeed,S.runW)));
  if(stepping)S.gp+=S.hz*dt;
  // crouch before takeoff and after landing
  const crT=S.fs==="crouch"?1:S.fs==="touch"?Math.max(0,1-S.ft/.6):0;
  S.crouch+=(crT-S.crouch)*k(dt,S.fs==="touch"&&S.ft<.12?25:6);
  // body bob: walk dips twice per cycle, run lifts when few feet are down (airborne phase)
  let bobT=0;if(S.step>.01)bobT=S.runW>.5?Math.max(0,2-S.support)*.12:-.045*Math.cos(4*Math.PI*S.gp);
  S.bob+=(bobT*S.step-S.bob)*k(dt,10);
  // wings
  let rate=.25,amp=.05,base=.08,sweep=0;
  if(S.fs==="crouch"){base=.45;rate=.5;}
  else if(S.fs==="climb"){rate=TUNE.climbHz;amp=1;base=.1;}
  else if(S.fs==="cruise"){rate=TUNE.cruiseHz;amp=S.glide>0?0:.75;base=S.glide>0?.16:.1;}
  else if(S.fs==="land"){if(S.alt<1.6){rate=1.9;amp=.9;base=.2;sweep=-.35;}else{rate=1;amp=.15;base=.16;}}
  else if(S.fs==="touch"){base=-.05;}
  else if(hov){rate=1.6;amp=.95;base=.1;}
  else if(m==="run"&&S.step>.3){rate=3;amp=.1;base=.18;}
  else if(m==="walk"&&S.step>.3){rate=.8;amp=.03;base=-.12;}
  S.wRate+=(rate-S.wRate)*k(dt,4);S.amp+=(amp-S.amp)*k(dt,S.fs==="climb"?8:3.5);S.base+=(base-S.base)*k(dt,3);S.sweep+=(sweep-S.sweep)*k(dt,3);
  const prev=S.wp;S.wp=frac(S.wp+S.wRate*dt);
  if(S.wp<prev){if(S.amp>.4)burst(260,.8,.28);
    if(S.fs==="cruise"&&S.glide<=0&&++S.flaps>=TUNE.flapsBeforeGlide){S.glide=TUNE.glideTime;S.flaps=0;}}
  if(S.glide>0)S.glide-=dt;
  // body pose in the world
  const lift=-.12*S.amp*wingCurve(S.wp)*Math.min(1,S.alt);
  let rollT,pitchT;
  if(air){rollT=-Math.min(.45,S.turn*S.speed*.14);pitchT=S.fs==="land"&&S.alt<1.4?-.32:-Math.atan2(S.vy,Math.max(2,S.speed))*.8;}
  else{const gA=2*Math.PI*S.gp;rollT=-S.turn*S.speed*.04+S.step*(1-S.runW)*.035*Math.sin(gA);pitchT=S.crouch*.07+S.runW*S.step*.035*Math.sin(gA);}
  S.roll+=(rollT-S.roll)*k(dt,3);S.pitch+=(pitchT-S.pitch)*k(dt,3);
  model.position.set(S.pos.x,S.alt+S.bob+lift-S.crouch*.42,S.pos.z);
  model.rotation.set(S.pitch,S.heading,S.roll);
}

/* two-bone leg IK in the leg's side plane (model space) */
const _a=new V(),_b=new V(),_c=new V(),_e=new V(),_f=new V(),_n=new V(),_t=new V();
function legIK(L,targetW){
  const H=inner.worldToLocal(L.hip.b.getWorldPosition(_a));
  const T=inner.worldToLocal(_b.copy(targetW));
  let ty=T.y-H.y,tz=T.z-H.z,d=Math.hypot(ty,tz);
  const lo=Math.abs(L.L1-L.L2)+1e-3,hi=(L.L1+L.L2)*.998;
  if(d<1e-5){ty=-lo;tz=0;d=lo;}
  if(d>hi){ty*=hi/d;tz*=hi/d;d=hi;}else if(d<lo){ty*=lo/d;tz*=lo/d;d=lo;}
  const aT=Math.atan2(tz,ty),beta=Math.acos(Math.max(-1,Math.min(1,(L.L1*L.L1+d*d-L.L2*L.L2)/(2*L.L1*d))));
  let a1=aT+beta,ky=L.L1*Math.cos(a1),kz=L.L1*Math.sin(a1);
  if(Math.sign(ky*(tz-kz)-kz*(ty-ky))!==L.cross){a1=aT-beta;ky=L.L1*Math.cos(a1);kz=L.L1*Math.sin(a1);}
  const a2=Math.atan2(tz-kz,ty-ky);
  pose(L.hip,0);pose(L.knee,0);L.hip.b.updateMatrixWorld(true);
  const K0=inner.worldToLocal(L.knee.b.getWorldPosition(_c));
  const dh=wrapA(a1-Math.atan2(K0.z-H.z,K0.y-H.y));
  pose(L.hip,dh);L.hip.b.updateMatrixWorld(true);
  const K1=inner.worldToLocal(L.knee.b.getWorldPosition(_c)),A1=inner.worldToLocal(L.ankle.b.getWorldPosition(_e));
  const dk=wrapA(a2-Math.atan2(A1.z-K1.z,A1.y-K1.y));
  return [dh,dk,wrapA(a2-L.a2rest)];
}
function onPlant(L){if(S.step<.5)return;burst(140,S.runW>.5?.5:.26,.18);if(S.runW>.5)spawnDust(L.plant,2);}

const tailS={y:[0,0,0,0,0,0],yv:[0,0,0,0,0,0],p:[0,0,0,0,0,0],pv:[0,0,0,0,0,0]};
let prevBodyY=0,bodyVY=0;
function animateRig(fk,rk,dt){const r=rig,air=S.fs==="climb"||S.fs==="cruise"||S.fs==="land";
  const by=model.position.y;bodyVY+=((by-prevBodyY)/Math.max(dt,1e-4)-bodyVY)*k(dt,8);prevBodyY=by;
  const gA=2*Math.PI*S.gp;
  // spine flexes (gathers) and extends in the gallop
  const flex=S.runW*S.step*.11*Math.sin(gA);
  pose(r.spine,.015*Math.sin(t*1.7)+flex+S.crouch*.05);pose(r.chest,-flex*.7);
  // neck + head: stay steady against body pitch and bob, pump when running, look around when idle
  const pump=S.runW*S.step*.08*Math.sin(gA+.6);
  const n=.03*Math.sin(t*1.3)-rk*.12+fk*.1+S.runW*S.step*.12+pump-S.pitch*.5-(air?.06:0)+S.crouch*.1;
  const ny=.05*Math.sin(t*.6)*(1-S.step*.6)+S.turn*.25;
  const h=.03*Math.sin(t*1.3-.5)-rk*.32+fk*.04+pump*.5-S.pitch*.3-S.bob*.5;
  const hy=(.07*Math.sin(t*.5)+.03*Math.sin(t*1.3))*(1-S.step*.7)*(1-fk);
  pose(r.neck,n,ny);pose(r.head,h,hy);
  r.shoulders.forEach((e,i)=>pose(e,-(n+h),-(ny+hy),(i?-1:1)*.05*S.step*(1-S.runW)*Math.sin(gA+i*Math.PI)));
  pose(r.jaw,.03+.02*Math.sin(t*1.7)+fk*.42+rk*.6);pose(r.skull,-(fk*.1+rk*.16));
  // tail: spring chain, each segment follows the one before it
  const sway=S.step*lerp(.14,.06,S.runW)*Math.sin(gA-.8)+.03*Math.sin(t*.7);
  const yawDrive=-S.turn*(air?.9:.6)+sway;
  const pBase=air?-.01:S.step*S.runW*.035;
  r.tail.forEach((e,i)=>{
    const ty=i===0?yawDrive:tailS.y[i-1],tp=i===0?pBase-bodyVY*.02:tailS.p[i-1]*.85+pBase*.15;
    tailS.yv[i]+=(55*(ty-tailS.y[i])-8*tailS.yv[i])*dt;tailS.y[i]+=tailS.yv[i]*dt;
    tailS.pv[i]+=(55*(tp-tailS.p[i])-8*tailS.pv[i])*dt;tailS.p[i]+=tailS.pv[i]*dt;
    pose(e,tailS.p[i],tailS.y[i]*(1+rk));});
  // wings: power downstroke, wrist folds on the upstroke, still while gliding
  const v=wingCurve(S.wp),fold=(S.wp>=.4?Math.sin(Math.PI*(S.wp-.4)/.6):0)*S.amp;
  const tip=.04*Math.sin(t*2.3)*(S.glide>0?1:.3),a=S.base+S.amp*v;
  [[r.wr,1],[r.wl,-1]].forEach(([w,s],j)=>{
    pose(w[0],0,s*S.sweep*.5,s*a);
    pose(w[1],0,0,s*S.amp*.18*v);
    pose(w[2],0,s*(.32*fold-S.sweep*.3),s*(-.5*fold+tip*(j?-1:1)+.12*S.amp*Math.sin(2*Math.PI*S.wp-.9)));});
  if(glowMat)glowMat.emissiveIntensity=1.1+.35*Math.sin(t*2.2)+rk*2.5+fk*1.6;
  // legs: planted-foot IK on the ground, loose dangle in the air
  model.updateMatrixWorld(true);
  const gW=1-Math.min(1,S.alt/.6),sc=model.scale.x;
  const fwd=_f.set(Math.sin(S.heading),0,Math.cos(S.heading));
  const duty=lerp(TUNE.walkDuty,TUNE.runDuty,S.runW),liftH=lerp(TUNE.walkLift,TUNE.runLift,S.runW);
  const half=S.speed*duty/Math.max(S.hz,.1)/2;
  let support=0;
  r.legs.forEach((L,i)=>{
    const nW=inner.localToWorld(_n.copy(L.restA));nW.y=L.restA.y*sc;
    let target=L.plant;
    const ph=frac(S.gp+lerp(L.walk,L.run,S.runW));
    if(S.step>.05&&S.alt<.2){
      if(ph<duty){if(L.swing){L.plant.copy(L.land);L.swing=false;onPlant(L);}target=L.plant;support++;L.curl=0;}
      else{if(!L.swing){L.lift.copy(L.plant);L.swing=true;}
        const u=(ph-duty)/(1-duty);
        L.land.copy(nW).addScaledVector(fwd,half);
        target=_t.copy(L.lift).lerp(L.land,ease(u));target.y+=liftH*Math.sin(Math.PI*u);L.curl=Math.sin(Math.PI*u);}
    }else{L.plant.lerp(nW,k(dt,S.alt>.2?10:4));L.swing=false;support++;L.curl=0;target=L.plant;}
    let dh=0,dk=0,da=0;if(gW>.001)[dh,dk,da]=legIK(L,target);
    let fh=0,fkn=0,fa=0;
    if(gW<1){const reach=S.fs==="land"&&S.alt<1.6?1:0;
      fh=(L.front?.12:.22)+.07*Math.sin(t*1.8+i*1.3)-reach*(L.front?.35:.2);fkn=.12;fa=.3+.06*Math.sin(t*1.8+i)-reach*.2;
      fh+=S.pedal*.4*Math.sin(t*6.5+i*1.7);fkn+=S.pedal*.3*(.5+.5*Math.sin(t*6.5+i*1.7+1.2));}
    pose(L.hip,lerp(fh,dh,gW));pose(L.knee,lerp(L.ks*fkn,dk,gW));pose(L.ankle,lerp(fa,-da+L.curl*.35,gW));
  });
  S.support=support;
}

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);t+=dt;
  if(act.fire>=0){act.fire+=dt;if(act.fire>FIRE_DUR)act.fire=-1;}
  if(act.roar>=0){act.roar+=dt;if(act.roar>ROAR_DUR)act.roar=-1;}
  if(act.flap>0)act.flap-=dt;
  const fk=env(act.fire,FIRE_DUR,.3,.4),rk=env(act.roar,ROAR_DUR,.25,.5);
  if(model&&rig){
    const tx=controls.target.x,tz=controls.target.z,ty=controls.target.y;
    move(dt);animateRig(fk,rk,dt);
    const dx=(S.pos.x-tx)*k(dt,2),dz=(S.pos.z-tz)*k(dt,2),dy=(1.8+S.alt*.85-ty)*k(dt,2);
    controls.target.x+=dx;controls.target.y+=dy;controls.target.z+=dz;camera.position.x+=dx;camera.position.y+=dy;camera.position.z+=dz;
    sun.position.set(S.pos.x+6,12,S.pos.z+7);sun.target.position.set(S.pos.x,0,S.pos.z);
    if(fk>.5&&act.fire>.25&&act.fire<FIRE_DUR-.35){fire.acc+=dt*fire.pool.length*1.05;const nn=Math.floor(fire.acc);fire.acc-=nn;if(nn)emit(nn);}
    if(fk>0){getMouth(_p,_d);fireLight.position.copy(_p);fireLight.intensity=fk*(3+Math.random()*1.5);}else fireLight.intensity=0;
  }
  updateFire(dt);updateDust(dt);
  motes.forEach(sp=>{const u=sp.userData;u.y+=u.sp*dt;if(u.y>8)u.y=0;u.a+=dt*.05;sp.position.set(controls.target.x+Math.cos(u.a)*u.r,u.y,controls.target.z+Math.sin(u.a)*u.r);sp.material.opacity=Math.sin(u.y/8*Math.PI)*.8;});
  controls.update();
  const sx=rk>0?(Math.random()-.5)*.14*rk:0,sy=rk>0?(Math.random()-.5)*.14*rk:0;
  camera.position.x+=sx;camera.position.y+=sy;renderer.render(scene,camera);camera.position.x-=sx;camera.position.y-=sy;
}

/* ---------- sizing ---------- */
let placed=false;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(!placed){placed=true;const asp=w/h,dist=asp<.8?21:asp<1.25?16:13.5;camera.position.copy(controls.target).add(new V(.62,.3,.72).normalize().multiplyScalar(dist));}}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- load Gloomjaw ---------- */
const loader=new THREE.GLTFLoader();
function fail(){$("#loadText").textContent="Gloomjaw didn't load";$("#loadSub").textContent="Close this page and open it again.";}
fetch("gloomjaw-glb.txt").then(r=>{if(!r.ok)throw 0;return r.text();})
  .then(s=>{const bin=atob(s.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    loader.parse(u.buffer,"",g=>{
      inner=g.scene;inner.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;if(o.material&&o.material.emissiveMap)glowMat=o.material;}});
      const box=new THREE.Box3().setFromObject(inner),size=box.getSize(new V()),c=box.getCenter(new V());
      inner.position.set(-c.x,-box.min.y,-c.z);
      model=new THREE.Group();model.rotation.order="YXZ";model.add(inner);model.scale.setScalar(7/Math.max(size.x,size.y,size.z));scene.add(model);
      model.updateMatrixWorld(true);rig=setupRig();
      $("#loading").classList.add("done");
    },fail);})
  .catch(fail);

/* ---------- buttons ---------- */
const modeBtns={walk:$("#mWalk"),run:$("#mRun"),fly:$("#mFly")};
const statusText={idle:"Drag to look around · Pinch to zoom",walk:"Gloomjaw is walking",run:"Gloomjaw is running!",fly:"Gloomjaw is flying! Tap Fly again to land"};
function setMode(m){S.mode=S.mode===m?"idle":m;audio();
  Object.entries(modeBtns).forEach(([k2,b])=>b.setAttribute("aria-pressed",String(S.mode===k2)));$("#status").textContent=statusText[S.mode];}
Object.keys(modeBtns).forEach(m=>modeBtns[m].addEventListener("click",()=>setMode(m)));
$("#aFlap").addEventListener("click",()=>{act.flap=FLAP_DUR;audio();});
$("#aFire").addEventListener("click",()=>{if(act.fire<0){act.fire=0;sfxFire();}});
$("#aRoar").addEventListener("click",()=>{if(act.roar<0){act.roar=0;sfxRoar();}});
$("#bSpin").addEventListener("click",e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute("aria-pressed",String(controls.autoRotate));});
$("#bMute").addEventListener("click",e=>{muted=!muted;e.currentTarget.textContent=muted?"Sound off":"Sound on";e.currentTarget.setAttribute("aria-pressed",String(muted));});

tick();
})();
</script>
